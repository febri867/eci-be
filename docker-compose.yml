services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: eci-backend
    ports:
      - "4000:4000"
    volumes:
      - .:/app
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - mongodb
  mongodb:
    image: mongo:7
    container_name: eci-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: eci-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mongodb_data:
  elasticsearch_data: