services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: eci-backend
    ports:
      - "4000:4000"
    volumes:
      - .:/app
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - mongodb
  mongodb:
    image: mongo:7
    container_name: eci-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
volumes:
  mongodb_data: